<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획 가지도</title>
<style>
:root{
  --bg:#f6f3ec; --dot:#e3ddd0; --card:#fffdf8; --ink:#2b2a27; --muted:#7b776d; --line:#d8d2c4;
  --panel:#fffdf8; --accent:#3f7a52; --shadow:0 1px 2px rgba(60,50,30,.12),0 4px 14px rgba(60,50,30,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1c19; --dot:#2b2a26; --card:#2a2925; --ink:#ece8dd; --muted:#9a9588; --line:#44413a;
    --panel:#24231f; --accent:#6fb384; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

#toolbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#toolbar h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.01em}
#toolbar h1,.btn{white-space:nowrap}
@media (max-width:720px){#toolbar{overflow-x:auto;padding:0 8px}.btn{padding:6px 8px}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#c0463a}
.spacer{flex:1}
#legend{display:flex;gap:10px;font-size:12px;color:var(--muted)}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}

#viewport{position:fixed;inset:52px 0 0 0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:26px 26px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.node{position:absolute;width:210px;height:108px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  border:1px solid var(--line);border-left:7px solid var(--c);padding:10px 12px;display:flex;gap:8px;cursor:pointer;
  transition:box-shadow .15s,transform .15s}
.node:hover{transform:translateY(-2px)}
.node.sel{outline:2.5px solid var(--c);outline-offset:2px}
.node.dropped{opacity:.62;border-style:dashed;border-left-style:solid}
.node.dropped .nt{text-decoration:line-through;text-decoration-color:var(--muted)}
.node .body{flex:1;min-width:0;display:flex;flex-direction:column}
.nt{font-size:14px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.nm{margin-top:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:1px 7px;border-radius:99px;color:#fff;background:var(--sc)}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;align-self:flex-start;border:1px solid var(--line)}
.imgn{position:absolute;right:8px;bottom:8px;font-size:10.5px;color:var(--muted)}
.addb{position:absolute;right:-14px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;border:none;
  background:var(--c);color:#fff;font-size:18px;line-height:1;display:none;box-shadow:var(--shadow);padding:0}
.node:hover .addb,.node.sel .addb{display:block}

#panel{position:fixed;top:52px;right:0;bottom:0;width:380px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);
  z-index:15;display:none;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.08)}
#panel.open{display:flex}
#panel .ph{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
#panel .ph b{flex:1;font-size:14px}
#panel .pb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);width:100%}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.in{min-height:150px;resize:vertical;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.im{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.im img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.im button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;padding:0}
#drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--muted)}
#drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:6px}
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;pointer-events:none}
#empty .btn{pointer-events:auto}
#zoomhint{position:fixed;left:16px;bottom:12px;font-size:12px;color:var(--muted);z-index:5}
@media (max-width:720px){#legend{display:none}#panel{width:100vw}}
</style>
</head>
<body>
<div id="toolbar">
  <h1>🌿 기획 가지도</h1>
  <button class="btn primary" id="addRoot">+ 새 기획(뿌리)</button>
  <button class="btn" id="fit">화면 맞춤</button>
  <div class="spacer"></div>
  <div id="legend"></div>
  <button class="btn" id="exp">내보내기</button>
  <button class="btn" id="imp">불러오기</button>
  <button class="btn" id="sample">예시</button>
  <input type="file" id="impFile" accept="application/json" hidden>
</div>

<div id="viewport">
  <div id="world"></div>
  <div id="empty"><div style="font-size:15px">아직 기획이 없어요.<br>첫 번째 기획(뿌리)을 심어 보세요.</div><button class="btn primary" id="addRoot2">+ 새 기획 추가</button></div>
</div>
<div id="zoomhint">드래그: 이동 · 휠: 확대/축소 · 카드 클릭: 편집 · 카드의 + : 가지 치기</div>

<aside id="panel">
  <div class="ph"><b id="pTitle">기획 편집</b><button class="btn" id="pClose">닫기</button></div>
  <div class="pb">
    <label class="f">제목<input class="in" id="fTitle" placeholder="기획 이름"></label>
    <div class="row2">
      <label class="f">날짜<input class="in" type="date" id="fDate"></label>
      <label class="f">상태<select class="in" id="fStatus"></select></label>
    </div>
    <label class="f">내용 / 변경 이유<textarea class="in" id="fText" placeholder="이 기획의 내용, 왜 이렇게 바뀌었는지 적어 보세요"></textarea></label>
    <div>
      <div class="hint" style="margin-bottom:6px">이미지</div>
      <div id="imgs"></div>
      <div id="drop" style="margin-top:8px">이미지를 끌어다 놓거나 붙여넣기(Ctrl+V)<br><button class="btn" id="pick" style="margin-top:8px">파일 선택</button></div>
      <input type="file" id="imgFile" accept="image/*" multiple hidden>
    </div>
    <div class="hint" id="pInfo"></div>
    <button class="btn primary" id="branch">🌱 이 기획에서 가지 치기</button>
    <button class="btn danger" id="del">이 기획 삭제</button>
  </div>
</aside>
<div id="lightbox"><img alt=""></div>

<script>
const STATUS = {
  idea:{label:'아이디어',color:'#b08a2e'},
  active:{label:'진행중',color:'#3f7cac'},
  adopted:{label:'채택',color:'#3f8a56'},
  dropped:{label:'폐기',color:'#8a8578'}
};
const LANE_COLORS=['#4f8a5b','#c0762f','#3f7cac','#a8507e','#7a6bb5','#a89530','#2f9a9a','#c4574a'];
const W=210,H=108,COLW=290,ROWH=170,PAD=90;

let state={nodes:[]}, selId=null;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- storage (IndexedDB, localStorage fallback) ---------- */
let dbp=null;
function db(){
  if(!dbp) dbp=new Promise((res,rej)=>{
    try{const r=indexedDB.open('plan-tree',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}
  });
  return dbp;
}
async function load(){
  try{const d=await db();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
  catch(e){try{return JSON.parse(localStorage.getItem('plan-tree')||'null')}catch(_){return null}}
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{
  try{const d=await Promise.race([db(),new Promise((_,r)=>setTimeout(r,1500))]);d.transaction('kv','readwrite').objectStore('kv').put(state,'state')}
  catch(e){try{localStorage.setItem('plan-tree',JSON.stringify(state))}catch(_){}}
},250)}

/* ---------- layout ---------- */
let pos={};
function layout(){
  const nodes=state.nodes, by={}, kids={};
  nodes.forEach(n=>{by[n.id]=n;kids[n.id]=[]});
  const roots=[];
  const cmp=(a,b)=>(a.date||'').localeCompare(b.date||'')||a.createdAt-b.createdAt;
  nodes.forEach(n=>{if(n.parentId&&by[n.parentId])kids[n.parentId].push(n);else roots.push(n)});
  roots.sort(cmp);Object.values(kids).forEach(k=>k.sort(cmp));
  const dates=[...new Set(nodes.map(n=>n.date||''))].sort();
  const rank={};dates.forEach((d,i)=>rank[d]=i);
  const colMemo={};
  const col=n=>{if(n.id in colMemo)return colMemo[n.id];
    const p=n.parentId&&by[n.parentId];
    return colMemo[n.id]=Math.max(rank[n.date||''],p?col(p)+1:0)};
  pos={};let maxLane=-1;
  const dfs=(n,lane,depth,laneColor)=>{
    pos[n.id]={x:PAD+col(n)*COLW,y:PAD+lane*ROWH,lane,depth,color:laneColor};
    kids[n.id].forEach((c,i)=>{
      if(i===0)dfs(c,lane,depth+1,laneColor);
      else{const l=++maxLane;dfs(c,l,depth+1,LANE_COLORS[l%LANE_COLORS.length])}
    });
  };
  roots.forEach(r=>{const l=++maxLane;dfs(r,l,0,LANE_COLORS[l%LANE_COLORS.length])});
  return {by,kids};
}

/* ---------- render ---------- */
const world=$('world');
function render(){
  const {by}=layout();
  world.innerHTML='';
  $('empty').style.display=state.nodes.length?'none':'flex';
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  let mx=0,my=0;
  Object.values(pos).forEach(p=>{mx=Math.max(mx,p.x+W+PAD);my=Math.max(my,p.y+H+PAD)});
  svg.setAttribute('width',mx);svg.setAttribute('height',my);
  state.nodes.forEach(n=>{
    const p=by[n.parentId];if(!p)return;
    const a=pos[p.id],b=pos[n.id];
    const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,dx=Math.max(40,(x2-x1)/2);
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none');path.setAttribute('stroke',b.color);
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-width',Math.max(3,10-b.depth*1.4));
    if(n.status==='dropped')path.setAttribute('stroke-dasharray','2 9');
    path.setAttribute('opacity',n.status==='dropped'?.6:.85);
    svg.appendChild(path);
  });
  world.appendChild(svg);
  state.nodes.forEach(n=>{
    const p=pos[n.id],st=STATUS[n.status]||STATUS.idea;
    const el=document.createElement('div');
    el.className='node'+(n.status==='dropped'?' dropped':'')+(n.id===selId?' sel':'');
    el.style.cssText=`left:${p.x}px;top:${p.y}px;--c:${p.color};--sc:${st.color}`;
    el.dataset.id=n.id;
    const body=document.createElement('div');body.className='body';
    const t=document.createElement('div');t.className='nt';t.textContent=n.title||'(제목 없음)';
    const m=document.createElement('div');m.className='nm';
    const c=document.createElement('span');c.className='chip';c.textContent=st.label;
    const d=document.createElement('span');d.textContent=n.date||'';
    m.append(c,d);body.append(t,m);el.append(body);
    if(n.images.length){
      const im=document.createElement('img');im.className='thumb';im.src=n.images[0];im.alt='';el.append(im);
      if(n.images.length>1){const k=document.createElement('span');k.className='imgn';k.textContent='🖼 '+n.images.length;el.append(k)}
    }
    const ab=document.createElement('button');ab.className='addb';ab.textContent='+';ab.title='여기서 가지 치기';
    ab.onclick=e=>{e.stopPropagation();addChild(n.id)};
    ab.onpointerdown=e=>e.stopPropagation();
    el.append(ab);
    el.onclick=()=>select(n.id);
    el.onpointerdown=e=>e.stopPropagation();
    world.appendChild(el);
  });
}
function renderLegend(){
  $('legend').innerHTML='';
  Object.values(STATUS).forEach(s=>{const sp=document.createElement('span');const i=document.createElement('i');i.style.background=s.color;sp.append(i,s.label);$('legend').append(sp)});
}

/* ---------- pan / zoom ---------- */
let view={x:0,y:0,s:1};
const vp=$('viewport');
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`}
let drag=null;
vp.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};vp.classList.add('panning');vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView()});
vp.addEventListener('pointerup',()=>{drag=null;vp.classList.remove('panning')});
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const ns=Math.min(2.2,Math.max(.25,view.s*Math.exp(-e.deltaY*.0015)));
  view.x=mx-(mx-view.x)*ns/view.s;view.y=my-(my-view.y)*ns/view.s;view.s=ns;applyView();
},{passive:false});
function fit(){
  const ps=Object.values(pos);if(!ps.length){view={x:0,y:0,s:1};applyView();return}
  const x0=Math.min(...ps.map(p=>p.x))-40,y0=Math.min(...ps.map(p=>p.y))-40;
  const x1=Math.max(...ps.map(p=>p.x+W))+40,y1=Math.max(...ps.map(p=>p.y+H))+40;
  const r=vp.getBoundingClientRect(),avail=r.width-(selId&&window.innerWidth>720?380:0);
  const s=Math.min(1.1,avail/(x1-x0),r.height/(y1-y0));
  view.s=s;view.x=(avail-(x1-x0)*s)/2-x0*s;view.y=(r.height-(y1-y0)*s)/2-y0*s;applyView();
}
function centerOn(id){
  const p=pos[id];if(!p)return;const r=vp.getBoundingClientRect();
  const avail=r.width-(window.innerWidth>720?380:0);
  view.x=avail/2-(p.x+W/2)*view.s;view.y=r.height/2-(p.y+H/2)*view.s;
  world.style.transition='transform .35s';applyView();setTimeout(()=>world.style.transition='',380);
}

/* ---------- panel ---------- */
const sel_=$('fStatus');
Object.entries(STATUS).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.label;sel_.append(o)});
const cur=()=>state.nodes.find(n=>n.id===selId);
function select(id,focus){
  selId=id;render();
  const n=cur();
  if(!n){$('panel').classList.remove('open');return}
  $('panel').classList.add('open');
  $('fTitle').value=n.title;$('fDate').value=n.date;$('fStatus').value=n.status;$('fText').value=n.text;
  const par=state.nodes.find(x=>x.id===n.parentId);
  $('pInfo').textContent=par?`"${par.title||'제목 없음'}" 에서 갈라져 나온 기획`:'뿌리 기획 (시작점)';
  renderImgs();
  if(focus){$('fTitle').focus();$('fTitle').select()}
}
function renderImgs(){
  const n=cur(),box=$('imgs');box.innerHTML='';if(!n)return;
  n.images.forEach((src,i)=>{
    const w=document.createElement('div');w.className='im';
    const im=document.createElement('img');im.src=src;im.alt='';im.onclick=()=>{$('lightbox').querySelector('img').src=src;$('lightbox').classList.add('open')};
    const b=document.createElement('button');b.textContent='×';b.title='삭제';
    b.onclick=()=>{n.images.splice(i,1);save();renderImgs();render()};
    w.append(im,b);box.append(w);
  });
}
function bind(id,key){$(id).addEventListener('input',e=>{const n=cur();if(!n)return;n[key]=e.target.value;save();if(key!=='text')render()})}
bind('fTitle','title');bind('fDate','date');bind('fStatus','status');bind('fText','text');
$('pClose').onclick=()=>{selId=null;$('panel').classList.remove('open');render()};
$('lightbox').onclick=()=>$('lightbox').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('lightbox').classList.remove('open')}});

/* ---------- images ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const m=1400,k=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
  });
}
async function addFiles(files){
  const n=cur();if(!n)return;
  for(const f of files){if(!f.type.startsWith('image/'))continue;try{n.images.push(await compress(f))}catch(_){}}
  save();renderImgs();render();
}
$('pick').onclick=()=>$('imgFile').click();
$('imgFile').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));
document.addEventListener('paste',e=>{
  if(!cur())return;
  const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(fs.length){e.preventDefault();addFiles(fs)}
});

/* ---------- actions ---------- */
function newNode(parentId,date){
  const n={id:uid(),parentId,title:'새 기획',date:date||today(),status:'idea',text:'',images:[],createdAt:Date.now()};
  state.nodes.push(n);return n;
}
function addChild(pid){
  const p=state.nodes.find(n=>n.id===pid);
  const d=today()>p.date?today():p.date;
  const n=newNode(pid,d);save();select(n.id,true);centerOn(n.id);
}
function addRoot(){const n=newNode(null);save();select(n.id,true);centerOn(n.id)}
$('addRoot').onclick=addRoot;$('addRoot2').onclick=addRoot;
$('branch').onclick=()=>selId&&addChild(selId);
$('fit').onclick=fit;
$('del').onclick=()=>{
  const n=cur();if(!n)return;
  const ids=new Set([n.id]);let ch=true;
  while(ch){ch=false;state.nodes.forEach(x=>{if(x.parentId&&ids.has(x.parentId)&&!ids.has(x.id)){ids.add(x.id);ch=true}})}
  const msg=ids.size>1?`"${n.title}" 와(과) 이어진 하위 기획 ${ids.size-1}개도 함께 삭제됩니다. 삭제할까요?`:`"${n.title}" 을(를) 삭제할까요?`;
  if(!confirm(msg))return;
  state.nodes=state.nodes.filter(x=>!ids.has(x.id));selId=null;$('panel').classList.remove('open');save();render();
};
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));
  a.download='기획-가지도-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('imp').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.nodes))throw 0;
    if(state.nodes.length&&!confirm('현재 내용을 불러온 파일로 바꿀까요?'))return;
    state={nodes:d.nodes.map(n=>({id:n.id||uid(),parentId:n.parentId||null,title:n.title||'',date:n.date||today(),status:STATUS[n.status]?n.status:'idea',text:n.text||'',images:Array.isArray(n.images)?n.images:[],createdAt:n.createdAt||Date.now()}))};
    selId=null;$('panel').classList.remove('open');save();render();fit();
  }catch(_){alert('올바른 기획 가지도 파일이 아닙니다.')}
};
function sample(){
  const t=Date.now();let i=0;
  const mk=(id,p,title,date,status,text)=>({id,parentId:p,title,date,status,text,images:[],createdAt:t+i++});
  return {nodes:[
    mk('a',null,'캠퍼스 생활 앱','2026-09-01','adopted','처음 아이디어: 학생들이 캠퍼스에서 쓰는 앱을 만든다. 범위가 너무 넓어 구체화가 필요했다.'),
    mk('b','a','중고거래 플랫폼','2026-09-08','dropped','이미 에브리타임·당근 등 경쟁 서비스가 많아 차별점이 부족해서 폐기.'),
    mk('c','a','스터디 매칭','2026-09-08','adopted','팀원 설문 결과 "같이 공부할 사람 찾기"의 수요가 가장 높았다.'),
    mk('d','c','시간표 기반 자동 매칭','2026-09-20','active','공강 시간이 겹치는 사람끼리 자동으로 추천한다.'),
    mk('e','c','관심 주제 태그 매칭','2026-09-20','idea','시간표 대신 주제 태그로 묶는 대안. 프로토타입 비교 예정.'),
    mk('f','d','AI 학습 요약 기능 추가','2026-10-05','idea','매칭된 스터디의 노트를 AI가 요약해 주는 확장 기능.'),
    mk('g','b','중고 전공책 교환 (축소안)','2026-09-15','dropped','전공책만 다루도록 범위를 좁혀 보았으나 사용 빈도가 낮을 것으로 판단.')
  ]};
}
$('sample').onclick=()=>{
  if(state.nodes.length&&!confirm('현재 내용이 예시 데이터로 바뀝니다. 계속할까요?'))return;
  state=sample();selId=null;$('panel').classList.remove('open');save();render();fit();
};

/* ---------- init ---------- */
(async()=>{
  renderLegend();
  const d=await Promise.race([load(),new Promise(r=>setTimeout(()=>r(null),1500))]).catch(()=>null);
  state=d&&Array.isArray(d.nodes)?d:sample();
  if(!d)save();
  render();fit();
})();
addEventListener('resize',()=>{});
</script>
</body>
</html>
